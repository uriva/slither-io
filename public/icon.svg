<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1324"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="serpentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#0088ff"/>
      <stop offset="70%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cosmic Squircle Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Glowing Food Orbs -->
  <circle cx="15" cy="18" r="2.8" fill="#ff007f" filter="url(#neonGlow)"/>
  <circle cx="49" cy="16" r="2.2" fill="#00ff66" filter="url(#neonGlow)"/>
  <circle cx="50" cy="46" r="3.2" fill="#ffcc00" filter="url(#neonGlow)"/>
  <circle cx="17" cy="47" r="2" fill="#00f0ff" filter="url(#neonGlow)"/>

  <!-- Glowing Serpentine S-Body -->
  <path d="M 45 47 C 32 52, 13 43, 17 28 C 20 16, 37 17, 37 28 C 37 38, 22 36, 32 44"
        fill="none"
        stroke="url(#serpentGrad)"
        stroke-width="8.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Scale Shimmer -->
  <path d="M 45 47 C 32 52, 13 43, 17 28 C 20 16, 37 17, 37 28 C 37 38, 22 36, 32 44"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-dasharray="2 4"
        stroke-opacity="0.5"/>

  <!-- Serpent Head -->
  <circle cx="45" cy="47" r="6.2" fill="#00f0ff" filter="url(#neonGlow)"/>

  <!-- Tracking Eyes -->
  <circle cx="43.5" cy="45.5" r="2.2" fill="#ffffff"/>
  <circle cx="47.2" cy="45.5" r="2.2" fill="#ffffff"/>
  <circle cx="44.2" cy="45.5" r="1.1" fill="#05070d"/>
  <circle cx="47.9" cy="45.5" r="1.1" fill="#05070d"/>

  <!-- Crown for #1 Rank -->
  <polygon points="41,41 43,43.5 45,40 47,43.5 49,41 49,43.5 41,43.5" fill="#ffd700"/>
</svg>
